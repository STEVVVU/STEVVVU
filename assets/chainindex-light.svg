<svg xmlns="http://www.w3.org/2000/svg" width="400" height="220" viewBox="0 0 400 220" role="img" aria-labelledby="title desc">
<title id="title">ChainIndex</title><desc id="desc">Reorg-aware EVM event indexing with a Solidity escrow contract and deterministic tests.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.trace{stroke-dasharray:1600;animation:draw 4.6s ease-out both}.arrive{animation:arrive 1.2s ease-out both}.orbit{transform-origin:770px 174px;animation:orbit 4.6s ease-out both}.spark{animation:spark 4.6s ease-out both}@keyframes draw{from{stroke-dashoffset:1600;opacity:.1}to{stroke-dashoffset:0;opacity:1}}@keyframes arrive{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@keyframes orbit{from{transform:rotate(-32deg);opacity:.2}to{transform:rotate(0);opacity:1}}@keyframes spark{0%,100%{opacity:.5}35%,70%{opacity:1}}@media(prefers-reduced-motion:reduce){.trace,.arrive,.orbit,.spark{animation:none}}</style>
<rect x="1" y="1" width="398" height="218" rx="12" fill="#f2f7f4" stroke="#b4cbc0"/>
    <text x="24" y="29" class="mono" font-size="11" letter-spacing="1.2" fill="#207956">05 / EVENT SYSTEMS</text>
    <text x="24" y="65" font-size="28" font-weight="650" letter-spacing="-.6" fill="#152f29">ChainIndex</text>
    <path d="M360 42H374V56M374 42L357 59" fill="none" stroke="#207956" stroke-width="1.5"/>
    <text x="24" y="94" font-size="16" fill="#42675b">Reorg-aware event indexing.</text>
    <text x="24" y="116" font-size="16" fill="#42675b">Solidity escrow and deterministic tests.</text>
    <g fill="none" stroke="#b4cbc0" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M34 151H356M171 151L219 186H309"/><g fill="#e8f0eb"><rect x="40" y="137" width="43" height="28" rx="4"/><rect x="112" y="137" width="43" height="28" rx="4"/><rect x="184" y="137" width="43" height="28" rx="4"/><rect x="256" y="137" width="43" height="28" rx="4"/><rect x="328" y="137" width="29" height="28" rx="4"/></g><g stroke="#a44c17" fill="#e8f0eb"><rect x="215" y="174" width="43" height="25" rx="4"/><rect x="282" y="174" width="43" height="25" rx="4"/></g></g>
    <text x="24" y="209" class="mono" font-size="10" letter-spacing="1" fill="#42675b">TYPESCRIPT / SOLIDITY</text>
</svg>
