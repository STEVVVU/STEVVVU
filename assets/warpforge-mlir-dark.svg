<svg xmlns="http://www.w3.org/2000/svg" width="400" height="220" viewBox="0 0 400 220" role="img" aria-labelledby="title desc">
<title id="title">WarpForge</title><desc id="desc">LLVM/MLIR optimization with graph fusion, tiling, vectorization, and progressive lowering.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.trace{stroke-dasharray:1600;animation:draw 4.6s ease-out both}.arrive{animation:arrive 1.2s ease-out both}.orbit{transform-origin:770px 174px;animation:orbit 4.6s ease-out both}.spark{animation:spark 4.6s ease-out both}@keyframes draw{from{stroke-dashoffset:1600;opacity:.1}to{stroke-dashoffset:0;opacity:1}}@keyframes arrive{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@keyframes orbit{from{transform:rotate(-32deg);opacity:.2}to{transform:rotate(0);opacity:1}}@keyframes spark{0%,100%{opacity:.5}35%,70%{opacity:1}}@media(prefers-reduced-motion:reduce){.trace,.arrive,.orbit,.spark{animation:none}}</style>
<rect x="1" y="1" width="398" height="218" rx="12" fill="#0b1214" stroke="#284247"/>
    <text x="24" y="29" class="mono" font-size="11" letter-spacing="1.2" fill="#a8f0c6">04 / COMPILERS</text>
    <text x="24" y="65" font-size="28" font-weight="650" letter-spacing="-.6" fill="#eff8f3">WarpForge</text>
    <path d="M360 42H374V56M374 42L357 59" fill="none" stroke="#a8f0c6" stroke-width="1.5"/>
    <text x="24" y="94" font-size="16" fill="#b2c8c4">Graph fusion and vectorization.</text>
    <text x="24" y="116" font-size="16" fill="#b2c8c4">LLVM / MLIR compiler passes.</text>
    <g fill="none" stroke="#284247" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M32 153H363"/><g fill="#101d20"><rect x="38" y="136" width="70" height="34" rx="5"/><rect x="157" y="130" width="80" height="46" rx="5"/><rect x="286" y="136" width="70" height="34" rx="5"/></g><g stroke="#a8f0c6"><path d="M49 147H95M49 158H82M168 142H224M168 153H214M168 164H198M297 147H345M297 158H332"/></g><path d="M124 146L131 153L124 160M254 146L261 153L254 160" stroke="#ffbc80"/></g>
    <text x="24" y="209" class="mono" font-size="10" letter-spacing="1" fill="#b2c8c4">C++ / MLIR</text>
</svg>
